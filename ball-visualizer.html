<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball Visualizer — Convergence</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #06080f; color: #ccd; font-family: monospace;
  padding: 32px; min-height: 100vh;
}
h1 {
  font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
  color: #5577aa; margin-bottom: 24px; text-align: center;
}
h2 {
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: #446688; margin: 28px 0 14px; border-bottom: 1px solid #1a2540; padding-bottom: 6px;
}

.grid {
  display: flex; flex-wrap: wrap; gap: 24px; justify-content: center;
}

.card {
  background: linear-gradient(135deg, rgba(8,16,40,0.92), rgba(4,8,24,0.96));
  border: 1px solid #1e2840; border-radius: 8px;
  padding: 16px; width: 180px; text-align: center;
}
.card canvas { border-radius: 4px; margin-bottom: 8px; }
.card .label {
  font-size: 11px; color: #88ccff; letter-spacing: 1px; text-transform: uppercase;
}
.card .sublabel {
  font-size: 9px; color: #3a5a80; margin-top: 2px;
}
.card .hex {
  font-size: 10px; color: #556688; margin-top: 4px;
}

.powerup-row {
  display: flex; gap: 12px; align-items: center; justify-content: center;
  margin-top: 8px;
}
.powerup-row canvas { border-radius: 4px; }
.powerup-label { font-size: 10px; color: #88aacc; }
</style>
</head>
<body>

<h1>Convergence — Ball Visualizer</h1>

<h2>Ball Colors & Textures</h2>
<div class="grid" id="ball-grid"></div>

<h2>Balls with Powerups</h2>
<div class="grid" id="powerup-grid"></div>

<h2>Powerup Icons</h2>
<div class="grid" id="icon-grid"></div>

<h2>Explosion Particles</h2>
<div class="grid" id="particle-grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── COLORS (mirrored from scene.js / path.js) ───
const COLORS = [
  0xFF2255, // ruby
  0x00AAFF, // sapphire
  0x00FF88, // emerald
  0xFFCC00, // amber
  0xCC44FF, // amethyst
];

const COLOR_EMISSIVE = [
  0x880020,
  0x004488,
  0x007744,
  0x886600,
  0x661188,
];

const COLOR_NAMES = ['Ruby', 'Sapphire', 'Emerald', 'Amber', 'Amethyst'];
const TEXTURE_NAMES = ['Brilliant Cut', 'Hex Facets', 'Emerald Cut', 'Starburst', 'Diamond Grid'];
const POWERUP_TYPES = ['pause', 'backwards', 'blast'];
const POWERUP_NAMES = ['Freeze', 'Reverse', 'Nova Blast'];

const BALL_RADIUS = 0.75;

// ─── TEXTURE GENERATORS (copied from scene.js) ───

function hexToRGB(hex) {
  return { r: (hex >> 16) & 0xff, g: (hex >> 8) & 0xff, b: hex & 0xff };
}

function makeColorSet(hex) {
  const { r, g, b } = hexToRGB(hex);
  return {
    base: `rgb(${r},${g},${b})`,
    dark: `rgb(${Math.round(r * 0.15)},${Math.round(g * 0.15)},${Math.round(b * 0.15)})`,
    mid:  `rgb(${Math.round(r * 0.45)},${Math.round(g * 0.45)},${Math.round(b * 0.45)})`,
    lite: `rgb(${Math.min(255, Math.round(r * 1.5 + 80))},${Math.min(255, Math.round(g * 1.5 + 80))},${Math.min(255, Math.round(b * 1.5 + 80))})`,
  };
}

function texBrilliant(ctx, S, cols) {
  const cx = S / 2, cy = S / 2, slices = 8;
  for (let i = 0; i < slices; i++) {
    const a1 = (i / slices) * Math.PI * 2, a2 = ((i + 1) / slices) * Math.PI * 2;
    const aMid = (a1 + a2) / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, S * 0.48, a1, a2); ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? cols.mid : cols.lite; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a1) * S * 0.22, cy + Math.sin(a1) * S * 0.22);
    ctx.lineTo(cx + Math.cos(aMid) * S * 0.22, cy + Math.sin(aMid) * S * 0.22);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? cols.lite : cols.mid; ctx.fill();
  }
  ctx.strokeStyle = cols.dark; ctx.lineWidth = S * 0.015;
  for (let i = 0; i < slices; i++) {
    const a = (i / slices) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * S * 0.48, cy + Math.sin(a) * S * 0.48); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, S * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = cols.lite; ctx.fill();
}

function texHexFacets(ctx, S, cols) {
  const r = S * 0.14, w = r * Math.sqrt(3);
  for (let row = -1; row < 7; row++) {
    for (let col = -1; col < 7; col++) {
      const cx = col * w + (row % 2 === 0 ? 0 : w / 2), cy = row * r * 1.5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        const x = cx + Math.cos(a) * r * 0.9, y = cy + Math.sin(a) * r * 0.9;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = (row + col) % 2 === 0 ? cols.mid : cols.lite; ctx.fill();
      ctx.strokeStyle = cols.dark; ctx.lineWidth = S * 0.018; ctx.stroke();
    }
  }
}

function texEmeraldCut(ctx, S, cols) {
  const step = S / 6;
  for (let i = -2; i < 10; i++) {
    ctx.beginPath();
    ctx.moveTo(i * step, 0); ctx.lineTo((i + 1) * step, 0);
    ctx.lineTo((i + 1) * step - S, S); ctx.lineTo(i * step - S, S);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? cols.mid : cols.lite; ctx.fill();
  }
  ctx.strokeStyle = cols.dark; ctx.lineWidth = S * 0.022;
  for (let i = -2; i < 10; i++) {
    ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step - S, S); ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * step + step * 0.5); ctx.lineTo(S, i * step + step * 0.5); ctx.stroke();
  }
}

function texStarburst(ctx, S, cols) {
  const cx = S / 2, cy = S / 2, rays = 12;
  for (let i = 0; i < rays; i++) {
    const a1 = (i / rays) * Math.PI * 2;
    const a2 = ((i + 0.5) / rays) * Math.PI * 2;
    const a3 = ((i + 1) / rays) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, S * 0.46, a1, a3); ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? cols.mid : cols.lite; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, S * 0.22, a1, a2); ctx.closePath();
    ctx.fillStyle = cols.lite; ctx.fill();
  }
  ctx.strokeStyle = cols.dark; ctx.lineWidth = S * 0.015;
  for (let i = 0; i < rays; i++) {
    const a = (i / rays) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * S * 0.46, cy + Math.sin(a) * S * 0.46); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, S * 0.07, 0, Math.PI * 2);
  ctx.fillStyle = cols.lite; ctx.fill();
}

function texDiamondGrid(ctx, S, cols) {
  ctx.save();
  ctx.translate(S / 2, S / 2); ctx.rotate(Math.PI / 4); ctx.translate(-S / 2, -S / 2);
  const step = S / 5;
  for (let row = -2; row < 8; row++) {
    for (let col = -2; col < 8; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? cols.mid : cols.lite;
      ctx.fillRect(col * step, row * step, step, step);
    }
  }
  ctx.strokeStyle = cols.dark; ctx.lineWidth = S * 0.022;
  for (let i = -2; i < 9; i++) {
    ctx.beginPath(); ctx.moveTo(i * step, -S); ctx.lineTo(i * step, S * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-S, i * step); ctx.lineTo(S * 2, i * step); ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(S / 2, S / 2, S * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = cols.lite; ctx.fill();
}

const textureFns = [texBrilliant, texHexFacets, texEmeraldCut, texStarburst, texDiamondGrid];

// ─── BALL TEXTURE (same as scene.js createBallTexture) ───

const ballTextures = [];

function getBallTexture(colorIdx) {
  if (!ballTextures[colorIdx]) ballTextures[colorIdx] = createBallTexture(colorIdx);
  return ballTextures[colorIdx];
}

function createBallTexture(colorIdx) {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const cols = makeColorSet(COLORS[colorIdx]);
  ctx.fillStyle = cols.base;
  ctx.fillRect(0, 0, S, S);
  textureFns[colorIdx](ctx, S, cols);
  return new THREE.CanvasTexture(cv);
}

// ─── SHARED THREE.JS SETUP ───
// Single WebGL renderer to avoid context limits. Render each scene sequentially,
// then blit to individual 2D canvases for display.

const RENDER_SIZE = 256;
const sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
sharedRenderer.setSize(RENDER_SIZE, RENDER_SIZE);
sharedRenderer.setPixelRatio(1); // fixed size, no DPR scaling needed
sharedRenderer.setClearColor(0x000008);

function createLitScene() {
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0x112244, 1.2));
  const dl = new THREE.DirectionalLight(0xaaddff, 1.8);
  dl.position.set(5, 8, 15); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xff88ff, 0.9);
  dl2.position.set(-8, -5, 10); scene.add(dl2);
  const pl = new THREE.PointLight(0x88ccff, 1.8, 40);
  pl.position.set(0, 0, 8); scene.add(pl);
  const pl2 = new THREE.PointLight(0xffffff, 1.0, 25);
  pl2.position.set(-6, 6, 10); scene.add(pl2);
  return scene;
}

const sharedCamera = new THREE.OrthographicCamera(-1.8, 1.8, 1.8, -1.8, -50, 50);
sharedCamera.position.set(0, 0, 20);
sharedCamera.lookAt(0, 0, 0);

// Render a scene once and blit to a new 2D canvas for static display
function renderToCanvas(threeScene, displaySize) {
  sharedRenderer.render(threeScene, sharedCamera);
  const cv = document.createElement('canvas');
  cv.width = cv.height = RENDER_SIZE;
  cv.style.width = displaySize + 'px';
  cv.style.height = displaySize + 'px';
  cv.getContext('2d').drawImage(sharedRenderer.domElement, 0, 0);
  return cv;
}

function createBallMesh(colorIdx) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 16, 12),
    new THREE.MeshStandardMaterial({
      map: getBallTexture(colorIdx),
      color: 0xffffff,
      metalness: 0.8,
      roughness: 0.05,
      emissive: COLOR_EMISSIVE[colorIdx]
    })
  );
}

// ─── POWERUP ICON GENERATORS (from scene.js) ───

function drawPowerupIcon(ctx, S, type) {
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#aaddff';
  ctx.shadowBlur = 10;

  if (type === 'pause') {
    const bw = S * 0.13, bh = S * 0.40, cy = S / 2, cx = S / 2;
    ctx.fillRect(cx - bw - S * 0.06, cy - bh / 2, bw, bh);
    ctx.fillRect(cx + S * 0.06, cy - bh / 2, bw, bh);
  } else if (type === 'backwards') {
    const cx = S / 2, cy = S / 2, r = S * 0.22;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy);
    ctx.lineTo(cx + r * 0.6, cy - r * 0.7);
    ctx.lineTo(cx + r * 0.6, cy + r * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(cx - r - S * 0.10, cy - r * 0.7, S * 0.09, r * 1.4);
  } else if (type === 'blast') {
    const cx = S / 2, cy = S / 2, spikes = 8;
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 14;
    for (let k = 0; k < spikes; k++) {
      const a = (k / spikes) * Math.PI * 2;
      const aHalf = a + Math.PI / spikes;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * S * 0.42, cy + Math.sin(a) * S * 0.42);
      ctx.lineTo(cx + Math.cos(aHalf) * S * 0.16, cy + Math.sin(aHalf) * S * 0.16);
      ctx.closePath();
      ctx.fillStyle = k % 2 === 0 ? '#ffffff' : '#ffdd44'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, S * 0.10, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
  }
}

function createPowerupSprite(type) {
  const S = 64;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  drawPowerupIcon(cv.getContext('2d'), S, type);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.6, 1.6, 1);
  return sprite;
}

function createPowerupHalo() {
  return new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS * 1.55, 8, 6),
    new THREE.MeshBasicMaterial({
      color: 0xaaddff, transparent: true, opacity: 0.18,
      side: THREE.BackSide, depthWrite: false
    })
  );
}

function hexStr(hex) {
  return '#' + hex.toString(16).padStart(6, '0').toUpperCase();
}

// ─── ANIMATED BALL CARDS ───
// Each entry: { scene, ball, extras, canvas2d } — re-rendered each frame via sharedRenderer

const spinners = [];

function createBallCard(colorIdx, displaySize, extras) {
  const sc = createLitScene();
  const ball = createBallMesh(colorIdx);
  sc.add(ball);
  if (extras) for (const ex of extras) sc.add(ex);

  // Initial render + blit
  sharedRenderer.render(sc, sharedCamera);
  const cv = document.createElement('canvas');
  cv.width = cv.height = RENDER_SIZE;
  cv.style.width = displaySize + 'px';
  cv.style.height = displaySize + 'px';
  cv.getContext('2d').drawImage(sharedRenderer.domElement, 0, 0);

  spinners.push({ scene: sc, ball, extras: extras || [], canvas2d: cv });
  return cv;
}

// Single animation loop — cycles through all spinners using the one shared renderer
function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() * 0.001;
  for (const s of spinners) {
    s.ball.rotation.y = t * 0.5;
    s.ball.rotation.x = Math.sin(t * 0.3) * 0.15;
    for (const ex of s.extras) {
      if (ex.isSprite) continue;
      if (ex.userData && ex.userData.spin) {
        ex.rotation.y = t * 0.5;
        ex.rotation.x = Math.sin(t * 0.3) * 0.15;
      }
    }
    sharedRenderer.render(s.scene, sharedCamera);
    s.canvas2d.getContext('2d').drawImage(sharedRenderer.domElement, 0, 0);
  }
}
animate();

// ─── BUILD UI ───

function addText(parent, cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  parent.appendChild(d);
}

// Ball grid
const ballGrid = document.getElementById('ball-grid');
for (let i = 0; i < COLORS.length; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  card.appendChild(createBallCard(i, 120));
  addText(card, 'label', COLOR_NAMES[i]);
  addText(card, 'sublabel', TEXTURE_NAMES[i]);
  addText(card, 'hex', hexStr(COLORS[i]) + ' / emissive ' + hexStr(COLOR_EMISSIVE[i]));
  ballGrid.appendChild(card);
}

// Powerup grid — each powerup type on a ball with sprite + halo
const powerupGrid = document.getElementById('powerup-grid');
for (let pi = 0; pi < POWERUP_TYPES.length; pi++) {
  const card = document.createElement('div');
  card.className = 'card';
  const colorIdx = pi % COLORS.length;

  const sprite = createPowerupSprite(POWERUP_TYPES[pi]);
  sprite.position.set(0, 0, 0.5);
  const halo = createPowerupHalo();
  halo.userData.spin = true;

  card.appendChild(createBallCard(colorIdx, 120, [sprite, halo]));
  addText(card, 'label', POWERUP_NAMES[pi]);
  addText(card, 'sublabel', 'on ' + COLOR_NAMES[colorIdx]);

  // Show on all ball colors below
  const row = document.createElement('div');
  row.className = 'powerup-row';
  for (let ci = 0; ci < COLORS.length; ci++) {
    const sp = createPowerupSprite(POWERUP_TYPES[pi]);
    sp.position.set(0, 0, 0.5);
    const h = createPowerupHalo();
    h.userData.spin = true;
    row.appendChild(createBallCard(ci, 28, [sp, h]));
  }
  card.appendChild(row);
  powerupGrid.appendChild(card);
}

// Icon grid — standalone powerup icons (2D canvas)
const iconGrid = document.getElementById('icon-grid');
for (let pi = 0; pi < POWERUP_TYPES.length; pi++) {
  const card = document.createElement('div');
  card.className = 'card';
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  drawPowerupIcon(cv.getContext('2d'), 128, POWERUP_TYPES[pi]);
  cv.style.width = '80px'; cv.style.height = '80px';
  card.appendChild(cv);
  addText(card, 'label', POWERUP_NAMES[pi]);
  addText(card, 'sublabel', POWERUP_TYPES[pi]);
  iconGrid.appendChild(card);
}

// Particle grid — explosion burst using actual 3D octahedra (static, rendered once)
const particleGrid = document.getElementById('particle-grid');
for (let i = 0; i < COLORS.length; i++) {
  const sc = createLitScene();
  const color = COLORS[i];
  for (let p = 0; p < 12; p++) {
    const size = 0.06 + Math.random() * 0.08;
    const mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(size, 0),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 + Math.random() * 0.5 })
    );
    const a = Math.random() * Math.PI * 2;
    const d = 0.3 + Math.random() * 0.8;
    mesh.position.set(Math.cos(a) * d, Math.sin(a) * d, 0);
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    sc.add(mesh);
  }
  for (let p = 0; p < 6; p++) {
    const size = 0.04 + Math.random() * 0.06;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(size, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 + Math.random() * 0.4 })
    );
    const a = Math.random() * Math.PI * 2;
    const d = 0.2 + Math.random() * 0.7;
    mesh.position.set(Math.cos(a) * d, Math.sin(a) * d, 0);
    sc.add(mesh);
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.appendChild(renderToCanvas(sc, 100));
  addText(card, 'label', COLOR_NAMES[i]);
  addText(card, 'sublabel', '12 colored + 6 white');
  particleGrid.appendChild(card);
}
</script>
</body>
</html>
