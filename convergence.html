<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convergence</title>
<link rel="stylesheet" href="convergence.css">
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="hud-panel">Score: <span class="value" id="score-val">0</span></div>
  <div class="hud-panel">Level: <span class="value" id="level-val">1</span></div>
  <div class="hud-panel">Chain: <span class="value" id="chain-bonus-val">x1</span></div>
</div>

<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="progress-label">RESONANCE</div>

<div id="swap-hint">Right-click or Space to swap</div>

<div id="audio-control">
  <button id="mute-btn" onclick="toggleMute()">SOUND</button>
  <input type="range" id="volume-slider" min="0" max="100" value="75" oninput="setVolume(this.value)">
</div>

<div id="title-screen">
  <div class="gear-deco"></div>
  <div class="gear-deco"></div>
  <div class="gear-deco"></div>
  <h1>CONVERGENCE</h1>
  <div class="subtitle">Align the Crystal Chain</div>
  <button class="btn-start" onclick="startGame()">BEGIN</button>
</div>

<div id="game-over">
  <h2 id="go-title">CONVERGENCE LOST</h2>
  <div class="final-score" id="final-score">Score: 0</div>
  <div class="final-score" id="final-level">Level: 1</div>
  <button class="btn-start" onclick="startGame()">TRY AGAIN</button>
</div>

<div id="pause-screen">
  <h2>PAUSED</h2>
  <div class="pause-hint">Press P or ESC to resume</div>
</div>

<div id="level-banner"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="audio.js"></script>
<script src="path.js"></script>
<script src="levels/level1.js"></script>
<script src="levels/level2.js"></script>
<script src="levels/level3.js"></script>
<script src="levels/level4.js"></script>
<script src="levels/level5.js"></script>
<script src="levels/level6.js"></script>
<script src="levels/level7.js"></script>
<script src="levels/level8.js"></script>
<script src="levels/level9.js"></script>
<script src="levels/level10.js"></script>
<script src="levels/level11.js"></script>
<script src="levels/level12.js"></script>
<script src="scene.js"></script>
<script src="chain.js"></script>
<script src="main.js"></script>
</body>
</html>
