<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Debug — Convergence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Spectral:ital,wght@0,400;1,400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000008;
  color: #88ccff;
  font-family: 'Spectral', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px;
  gap: 32px;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 22px;
  letter-spacing: 5px;
  color: #aaddff;
  text-shadow: 0 0 20px rgba(136,204,255,0.6);
}

.subtitle {
  font-style: italic;
  color: #334466;
  font-size: 13px;
  letter-spacing: 2px;
  margin-top: -24px;
}

/* ── Volume bar ── */
#vol-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(8,16,40,0.8);
  border: 1px solid #1e3355;
  border-radius: 6px;
  padding: 10px 18px;
}

#vol-row label { font-size: 11px; letter-spacing: 2px; color: #446688; text-transform: uppercase; }

#vol-slider {
  -webkit-appearance: none;
  width: 140px; height: 3px;
  background: #1a3355; border-radius: 2px; outline: none; cursor: pointer;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px; border-radius: 50%;
  background: #88ccff; cursor: pointer;
  box-shadow: 0 0 6px rgba(136,204,255,0.7);
}

/* ── Sound grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 780px;
}

.card {
  background: linear-gradient(135deg, rgba(8,16,40,0.95), rgba(4,8,24,0.98));
  border: 1px solid #1e3355;
  border-radius: 6px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #5599cc;
  text-transform: uppercase;
}

.card-desc {
  font-style: italic;
  font-size: 11px;
  color: #334466;
  line-height: 1.5;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 7px; }

button {
  font-family: 'Cinzel Decorative', serif;
  background: linear-gradient(135deg, #0d1e38, #162840);
  color: #7ab8dd;
  border: 1px solid #2a4466;
  padding: 7px 14px;
  font-size: 10px;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  text-transform: uppercase;
}
button:hover {
  background: linear-gradient(135deg, #162840, #1e3a58);
  color: #aaddff;
  box-shadow: 0 0 10px rgba(136,204,255,0.25);
}
button:active {
  transform: scale(0.96);
  box-shadow: 0 0 16px rgba(136,204,255,0.4);
}
button.flash {
  border-color: #66aadd;
  color: #ffffff;
  box-shadow: 0 0 18px rgba(136,204,255,0.6);
}

/* combo buttons */
.combo-btn { min-width: 38px; text-align: center; }

/* A/B engine toggle */
#ab-btn { font-weight: 700; }

/* ── Tweaker panel ── */
.tweaker { width: 100%; max-width: 780px; }

.tweaker-toggle {
  font-family: 'Cinzel Decorative', serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #5599cc;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  padding: 10px 0;
}
.tweaker-toggle:hover { color: #aaddff; }

.tweaker-body { display: none; }
.tweaker-body.open { display: block; }

.partial-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 1fr 1fr;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid #0d1a2e;
}

.partial-row .idx {
  font-size: 10px; color: #334466; text-align: center;
}

.param-group {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin: 12px 0;
}

.param-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.param-item label {
  font-size: 10px; letter-spacing: 1px; color: #446688;
  text-transform: uppercase; min-width: 70px;
}

.param-item input[type=range] {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 3px;
  background: #1a3355; border-radius: 2px; outline: none; cursor: pointer;
}
.param-item input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px; border-radius: 50%;
  background: #88ccff; cursor: pointer;
  box-shadow: 0 0 4px rgba(136,204,255,0.5);
}

.param-item .val {
  font-size: 10px; color: #88ccff; min-width: 36px; text-align: right;
}

.partial-header {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 1fr 1fr;
  gap: 8px;
  padding: 6px 0 2px;
}

.partial-header span {
  font-size: 9px; letter-spacing: 1px; color: #334466;
  text-transform: uppercase; text-align: center;
}

.section-label {
  font-size: 10px; letter-spacing: 2px; color: #446688;
  text-transform: uppercase; margin: 16px 0 6px; padding-top: 10px;
  border-top: 1px solid #1e3355;
}

#config-output {
  background: #050c18;
  border: 1px solid #1e3355;
  border-radius: 4px;
  color: #7ab8dd;
  font-family: monospace;
  font-size: 11px;
  width: 100%;
  min-height: 120px;
  padding: 10px;
  resize: vertical;
  display: none;
  margin-top: 8px;
}

.tweaker .btn-row { margin-top: 10px; }

/* ── Sequence card ── */
.card.wide {
  grid-column: 1 / -1;
}

.seq-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.seq-controls label { font-size: 11px; letter-spacing: 1px; color: #446688; }

.seq-controls input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 110px; height: 3px;
  background: #1a3355; border-radius: 2px; outline: none; cursor: pointer;
}
.seq-controls input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #88ccff; cursor: pointer;
  box-shadow: 0 0 5px rgba(136,204,255,0.6);
}

#seq-steps-val, #seq-gap-val { color: #88ccff; font-size: 11px; min-width: 28px; }

.seq-step-indicator {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 2px;
}

.seq-dot {
  width: 28px; height: 28px;
  border-radius: 3px;
  border: 1px solid #1e3355;
  background: #0a1428;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; letter-spacing: 0.5px; color: #334466;
  transition: all 0.1s;
}
.seq-dot.active-match { border-color: #88ccff; color: #aaddff; background: #0d1e3a; box-shadow: 0 0 8px rgba(136,204,255,0.4); }
.seq-dot.active-chain { border-color: #cc88ff; color: #cc88ff; background: #150d28; box-shadow: 0 0 8px rgba(204,136,255,0.4); }
</style>
</head>
<body>

<h1>CONVERGENCE</h1>
<div class="subtitle">Audio Debug</div>

<div id="vol-row">
  <label>Volume</label>
  <input type="range" id="vol-slider" min="0" max="100" value="75"
    oninput="masterGain && (masterGain.gain.value = this.value / 100)">
  <div style="width:1px;height:20px;background:#1e3355;margin:0 4px"></div>
  <label>Engine</label>
  <button id="ab-btn" onclick="toggleEngine()" style="min-width:60px">NEW</button>
</div>

<div class="grid" id="grid"></div>

<div class="tweaker" id="tweaker">
  <div class="tweaker-toggle" onclick="document.getElementById('tweaker-body').classList.toggle('open')">
    &#9662; Bell Engine Parameters
  </div>
  <div class="tweaker-body" id="tweaker-body">
    <div class="card">
      <div class="section-label">Partials</div>
      <div class="partial-header">
        <span>#</span><span>Ratio</span><span>Amp</span><span>Decay</span><span>Pan</span>
      </div>
      <div id="partial-rows"></div>

      <div class="section-label">Envelope</div>
      <div class="param-group" id="env-params"></div>

      <div class="section-label">Strike Transient</div>
      <div class="param-group" id="strike-params"></div>

      <div class="section-label">Chorus</div>
      <div class="param-group" id="chorus-params"></div>

      <div class="section-label">Presets</div>
      <div class="btn-row" id="preset-btns"></div>

      <div class="section-label">Test / Export</div>
      <div class="btn-row">
        <button onclick="playSound('match', 1)">Test Match</button>
        <button onclick="playSound('shoot')">Test Shoot</button>
        <button onclick="playSound('levelup')">Test Level Up</button>
        <button onclick="playSound('gameover')">Test Game Over</button>
        <button onclick="copyConfig()">Copy Config</button>
        <button onclick="resetConfig()">Reset</button>
      </div>
      <textarea id="config-output" readonly></textarea>
    </div>
  </div>
</div>

<div class="grid" style="max-width:780px;width:100%">
  <div class="card wide" id="seq-card">
    <div class="card-title">Chain Reaction Sequence</div>
    <div class="card-desc">Plays match → chain → match → chain… with the real 100 ms gap from the game. Each step increments the combo pitch.</div>
    <div class="seq-controls">
      <label>Steps</label>
      <input type="range" id="seq-steps" min="1" max="8" value="4"
        oninput="document.getElementById('seq-steps-val').textContent = this.value; buildDots();">
      <span id="seq-steps-val">4</span>
      <label style="margin-left:8px">Gap (ms)</label>
      <input type="range" id="seq-gap" min="50" max="600" value="100" step="10"
        oninput="document.getElementById('seq-gap-val').textContent = this.value;">
      <span id="seq-gap-val">100</span>
    </div>
    <div class="seq-step-indicator" id="seq-dots"></div>
    <div class="btn-row">
      <button id="seq-play-btn" onclick="playSequence()">▶ Play Sequence</button>
    </div>
  </div>
</div>

<script src="audio.js"></script>
<script>
// ── A/B toggle: old engine config ──
const OLD_CONFIG = {
  partials: [
    { ratio: 1.000, amp: 1.00, decay: 1.00, pan: 0 },
    { ratio: 2.756, amp: 0.38, decay: 0.72, pan: 0 },
    { ratio: 5.404, amp: 0.16, decay: 0.52, pan: 0 },
    { ratio: 8.933, amp: 0.07, decay: 0.38, pan: 0 },
  ],
  envelope: { attackTime: 0.001, sustainLevel: 0.01, sustainPoint: 0.99 },
  strike:   { minDuration: 9999, freqMult: 2.5, maxFreq: 11000, Q: 1.8, gain: 0, duration: 0.04 },
  chorus:   { detuneCents: 0 },
};

let usingNew = true;

function applyConfig(cfg) {
  BELL_CONFIG.partials = JSON.parse(JSON.stringify(cfg.partials));
  Object.assign(BELL_CONFIG.envelope, cfg.envelope);
  Object.assign(BELL_CONFIG.strike, cfg.strike);
  Object.assign(BELL_CONFIG.chorus, cfg.chorus);
}

function toggleEngine() {
  usingNew = !usingNew;
  applyConfig(usingNew ? DEFAULT_CONFIG : OLD_CONFIG);
  // Refresh tweaker sliders to reflect current config
  if (typeof buildPartialRows === 'function') {
    buildPartialRows(); buildEnvParams(); buildStrikeParams(); buildChorusParams();
  }
  const btn = document.getElementById('ab-btn');
  btn.textContent = usingNew ? 'NEW' : 'OLD';
  btn.style.borderColor = usingNew ? '#2a4466' : '#664422';
  btn.style.color = usingNew ? '#7ab8dd' : '#ddaa77';
}

const SOUND_DEFS = [
  {
    name: 'shoot',
    desc: 'Quick bright ping when firing a ball.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'hit',
    desc: 'Soft landing ting — ball joins chain, no match.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'match',
    desc: 'Crystal chord burst. Pitched up +2 semitones per combo level.',
    buttons: [1,2,3,4,5,6,7].map(n => ({ label: 'x' + n, args: [n] })),
  },
  {
    name: 'chain',
    desc: 'Chain reaction — higher voicing, same pitch ladder as match.',
    buttons: [1,2,3,4,5,6,7].map(n => ({ label: 'x' + n, args: [n] })),
  },
  {
    name: 'swap',
    desc: 'Two-note sparkle trill on ball swap.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'powerup',
    desc: 'Magical shimmer — powerup activated.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'levelup',
    desc: 'Ascending C major arpeggio — level cleared.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'gameover',
    desc: 'Descending A minor — game over.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'crystal',
    desc: 'Warm chime — bonus crystal collected (500 pts).',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'extralife',
    desc: 'Triumphant fanfare — extra life earned at 50k milestone.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'gapbonus',
    desc: 'Bright sparkle — gap crossing bonus (10× multiplier).',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'resonance',
    desc: 'Deep swell — resonance gauge peaked, no more balls.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'cleartick',
    desc: 'Quick soft tick — level clearance bonus counting.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'pause',
    desc: 'Soft thud — game paused.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'unpause',
    desc: 'Light ting — game unpaused.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'lifelost',
    desc: 'Sad descending tone — lost a life but still playing.',
    buttons: [{ label: 'Play', args: [] }],
  },
];

function flash(btn) {
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 300);
}

const grid = document.getElementById('grid');

for (const def of SOUND_DEFS) {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = def.name;

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = def.desc;

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  for (const b of def.buttons) {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (def.buttons.length > 1) btn.className = 'combo-btn';
    btn.onclick = () => { playSound(def.name, ...b.args); flash(btn); };
    btnRow.appendChild(btn);
  }

  card.append(title, desc, btnRow);
  grid.appendChild(card);
}

// ── Chain Reaction Sequence ──

function buildDots() {
  const steps = +document.getElementById('seq-steps').value;
  const container = document.getElementById('seq-dots');
  container.innerHTML = '';
  // Each step = match then chain (except last step has no trailing chain)
  for (let i = 1; i <= steps; i++) {
    const m = document.createElement('div');
    m.className = 'seq-dot';
    m.id = 'dot-match-' + i;
    m.textContent = 'M×' + i;
    container.appendChild(m);
    if (i < steps) {
      const c = document.createElement('div');
      c.className = 'seq-dot';
      c.id = 'dot-chain-' + i;
      c.textContent = 'C×' + i;
      container.appendChild(c);
    }
  }
}

let seqRunning = false;

function playSequence() {
  if (seqRunning) return;
  seqRunning = true;
  const btn = document.getElementById('seq-play-btn');
  btn.disabled = true;

  const steps = +document.getElementById('seq-steps').value;
  const gap   = +document.getElementById('seq-gap').value;

  // Build the event timeline:
  // match(1) at 0, chain(1) at gap, match(2) at gap*2, chain(2) at gap*3, …
  const events = [];
  for (let i = 1; i <= steps; i++) {
    events.push({ type: 'match', combo: i, t: (i - 1) * 2 * gap });
    if (i < steps) {
      events.push({ type: 'chain', combo: i, t: (i - 1) * 2 * gap + gap });
    }
  }

  // Reset dots
  document.querySelectorAll('.seq-dot').forEach(d => d.classList.remove('active-match', 'active-chain'));

  events.forEach(ev => {
    setTimeout(() => {
      playSound(ev.type, ev.combo);
      const dot = document.getElementById('dot-' + ev.type + '-' + ev.combo);
      if (dot) {
        dot.classList.add(ev.type === 'match' ? 'active-match' : 'active-chain');
        setTimeout(() => dot.classList.remove('active-match', 'active-chain'), gap * 0.8);
      }
    }, ev.t);
  });

  const totalDuration = events[events.length - 1].t + 800;
  setTimeout(() => {
    seqRunning = false;
    btn.disabled = false;
  }, totalDuration);
}

buildDots();

// ── Bell Engine Tweaker ──

// Deep-copy the initial config so we can reset
const DEFAULT_CONFIG = JSON.parse(JSON.stringify(BELL_CONFIG));

function makeSlider(container, label, value, min, max, step, onChange) {
  const item = document.createElement('div');
  item.className = 'param-item';

  const lbl = document.createElement('label');
  lbl.textContent = label;

  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step;
  inp.value = value;

  const val = document.createElement('span');
  val.className = 'val';
  val.textContent = Number(value).toFixed(step < 0.01 ? 3 : 2);

  inp.oninput = () => {
    const v = parseFloat(inp.value);
    val.textContent = v.toFixed(step < 0.01 ? 3 : 2);
    onChange(v);
  };

  item.append(lbl, inp, val);
  container.appendChild(item);
  return inp;
}

function buildPartialRows() {
  const container = document.getElementById('partial-rows');
  container.innerHTML = '';
  BELL_CONFIG.partials.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'partial-row';

    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = i + 1;
    row.appendChild(idx);

    // Ratio
    const r = document.createElement('div');
    makeSlider(r, '', p.ratio, 0.1, 12, 0.001, v => { BELL_CONFIG.partials[i].ratio = v; });
    row.appendChild(r);

    // Amp
    const a = document.createElement('div');
    makeSlider(a, '', p.amp, 0, 1, 0.01, v => { BELL_CONFIG.partials[i].amp = v; });
    row.appendChild(a);

    // Decay
    const d = document.createElement('div');
    makeSlider(d, '', p.decay, 0.05, 2, 0.01, v => { BELL_CONFIG.partials[i].decay = v; });
    row.appendChild(d);

    // Pan
    const pn = document.createElement('div');
    makeSlider(pn, '', p.pan, -1, 1, 0.01, v => { BELL_CONFIG.partials[i].pan = v; });
    row.appendChild(pn);

    container.appendChild(row);
  });
}

function buildEnvParams() {
  const c = document.getElementById('env-params');
  c.innerHTML = '';
  const e = BELL_CONFIG.envelope;
  makeSlider(c, 'Attack', e.attackTime, 0.001, 0.05, 0.001, v => { e.attackTime = v; });
  makeSlider(c, 'Sustain Lvl', e.sustainLevel, 0.05, 0.9, 0.01, v => { e.sustainLevel = v; });
  makeSlider(c, 'Sustain Pt', e.sustainPoint, 0.1, 0.8, 0.01, v => { e.sustainPoint = v; });
}

function buildStrikeParams() {
  const c = document.getElementById('strike-params');
  c.innerHTML = '';
  const s = BELL_CONFIG.strike;
  makeSlider(c, 'Gain', s.gain, 0, 0.5, 0.01, v => { s.gain = v; });
  makeSlider(c, 'Freq Mult', s.freqMult, 0.5, 6, 0.1, v => { s.freqMult = v; });
  makeSlider(c, 'Q', s.Q, 0.3, 8, 0.1, v => { s.Q = v; });
  makeSlider(c, 'Duration', s.duration, 0.005, 0.12, 0.005, v => { s.duration = v; });
}

function buildChorusParams() {
  const c = document.getElementById('chorus-params');
  c.innerHTML = '';
  makeSlider(c, 'Detune ¢', BELL_CONFIG.chorus.detuneCents, 0, 20, 0.5,
    v => { BELL_CONFIG.chorus.detuneCents = v; });
}

function copyConfig() {
  const cfg = BELL_CONFIG;
  const pad = (n, d = 2) => n.toFixed(d).padStart(d + 3);
  let s = 'const BELL_CONFIG = {\n  partials: [\n';
  for (const p of cfg.partials) {
    s += `    { ratio: ${pad(p.ratio, 3)}, amp: ${pad(p.amp)}, decay: ${pad(p.decay)}, pan: ${pad(p.pan)} },\n`;
  }
  s += '  ],\n  envelope: {\n';
  s += `    attackTime:   ${cfg.envelope.attackTime},\n`;
  s += `    sustainLevel: ${cfg.envelope.sustainLevel},\n`;
  s += `    sustainPoint: ${cfg.envelope.sustainPoint},\n`;
  s += '  },\n  strike: {\n';
  s += `    minDuration: ${cfg.strike.minDuration},\n`;
  s += `    freqMult:    ${cfg.strike.freqMult},\n`;
  s += `    maxFreq:     ${cfg.strike.maxFreq},\n`;
  s += `    Q:           ${cfg.strike.Q},\n`;
  s += `    gain:        ${cfg.strike.gain},\n`;
  s += `    duration:    ${cfg.strike.duration},\n`;
  s += '  },\n  chorus: {\n';
  s += `    detuneCents: ${cfg.chorus.detuneCents},\n`;
  s += '  },\n};\n';

  const ta = document.getElementById('config-output');
  ta.value = s;
  ta.style.display = 'block';
  ta.select();
  navigator.clipboard.writeText(s).catch(() => {});
}

function resetConfig() {
  Object.assign(BELL_CONFIG, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
  buildPartialRows();
  buildEnvParams();
  buildStrikeParams();
  buildChorusParams();
  document.getElementById('config-output').style.display = 'none';
}

// ── Presets ──

const PRESETS = {
  'Crystal (default)': DEFAULT_CONFIG,

  // Warm, woody, fundamental-heavy with fast upper decay — like a marimba

function loadPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  applyConfig(preset);
  buildPartialRows();
  buildEnvParams();
  buildStrikeParams();
  buildChorusParams();
}

// Build preset buttons
const presetContainer = document.getElementById('preset-btns');
for (const name of Object.keys(PRESETS)) {
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.onclick = () => { loadPreset(name); flash(btn); };
  presetContainer.appendChild(btn);
}
