<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Debug — Convergence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Spectral:ital,wght@0,400;1,400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000008;
  color: #88ccff;
  font-family: 'Spectral', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px;
  gap: 32px;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 22px;
  letter-spacing: 5px;
  color: #aaddff;
  text-shadow: 0 0 20px rgba(136,204,255,0.6);
}

.subtitle {
  font-style: italic;
  color: #334466;
  font-size: 13px;
  letter-spacing: 2px;
  margin-top: -24px;
}

/* ── Volume bar ── */
#vol-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(8,16,40,0.8);
  border: 1px solid #1e3355;
  border-radius: 6px;
  padding: 10px 18px;
}

#vol-row label { font-size: 11px; letter-spacing: 2px; color: #446688; text-transform: uppercase; }

#vol-slider {
  -webkit-appearance: none;
  width: 140px; height: 3px;
  background: #1a3355; border-radius: 2px; outline: none; cursor: pointer;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px; border-radius: 50%;
  background: #88ccff; cursor: pointer;
  box-shadow: 0 0 6px rgba(136,204,255,0.7);
}

/* ── Sound grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  width: 100%;
  max-width: 780px;
}

.card {
  background: linear-gradient(135deg, rgba(8,16,40,0.95), rgba(4,8,24,0.98));
  border: 1px solid #1e3355;
  border-radius: 6px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #5599cc;
  text-transform: uppercase;
}

.card-desc {
  font-style: italic;
  font-size: 11px;
  color: #334466;
  line-height: 1.5;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 7px; }

button {
  font-family: 'Cinzel Decorative', serif;
  background: linear-gradient(135deg, #0d1e38, #162840);
  color: #7ab8dd;
  border: 1px solid #2a4466;
  padding: 7px 14px;
  font-size: 10px;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  text-transform: uppercase;
}
button:hover {
  background: linear-gradient(135deg, #162840, #1e3a58);
  color: #aaddff;
  box-shadow: 0 0 10px rgba(136,204,255,0.25);
}
button:active {
  transform: scale(0.96);
  box-shadow: 0 0 16px rgba(136,204,255,0.4);
}
button.flash {
  border-color: #66aadd;
  color: #ffffff;
  box-shadow: 0 0 18px rgba(136,204,255,0.6);
}

/* combo buttons */
.combo-btn { min-width: 38px; text-align: center; }

/* ── Sequence card ── */
.card.wide {
  grid-column: 1 / -1;
}

.seq-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.seq-controls label { font-size: 11px; letter-spacing: 1px; color: #446688; }

.seq-controls input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 110px; height: 3px;
  background: #1a3355; border-radius: 2px; outline: none; cursor: pointer;
}
.seq-controls input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #88ccff; cursor: pointer;
  box-shadow: 0 0 5px rgba(136,204,255,0.6);
}

#seq-steps-val, #seq-gap-val { color: #88ccff; font-size: 11px; min-width: 28px; }

.seq-step-indicator {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 2px;
}

.seq-dot {
  width: 28px; height: 28px;
  border-radius: 3px;
  border: 1px solid #1e3355;
  background: #0a1428;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; letter-spacing: 0.5px; color: #334466;
  transition: all 0.1s;
}
.seq-dot.active-match { border-color: #88ccff; color: #aaddff; background: #0d1e3a; box-shadow: 0 0 8px rgba(136,204,255,0.4); }
.seq-dot.active-chain { border-color: #cc88ff; color: #cc88ff; background: #150d28; box-shadow: 0 0 8px rgba(204,136,255,0.4); }
</style>
</head>
<body>

<h1>CONVERGENCE</h1>
<div class="subtitle">Audio Debug</div>

<div id="vol-row">
  <label>Volume</label>
  <input type="range" id="vol-slider" min="0" max="100" value="75"
    oninput="masterGain && (masterGain.gain.value = this.value / 100)">
</div>

<div class="grid" id="grid"></div>

<div class="grid" style="max-width:780px;width:100%">
  <div class="card wide" id="seq-card">
    <div class="card-title">Chain Reaction Sequence</div>
    <div class="card-desc">Plays match → chain → match → chain… with the real 100 ms gap from the game. Each step increments the combo pitch.</div>
    <div class="seq-controls">
      <label>Steps</label>
      <input type="range" id="seq-steps" min="1" max="8" value="4"
        oninput="document.getElementById('seq-steps-val').textContent = this.value; buildDots();">
      <span id="seq-steps-val">4</span>
      <label style="margin-left:8px">Gap (ms)</label>
      <input type="range" id="seq-gap" min="50" max="600" value="100" step="10"
        oninput="document.getElementById('seq-gap-val').textContent = this.value;">
      <span id="seq-gap-val">100</span>
    </div>
    <div class="seq-step-indicator" id="seq-dots"></div>
    <div class="btn-row">
      <button id="seq-play-btn" onclick="playSequence()">▶ Play Sequence</button>
    </div>
  </div>
</div>

<script src="audio.js"></script>
<script>
const SOUND_DEFS = [
  {
    name: 'shoot',
    desc: 'Quick bright ping when firing a ball.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'hit',
    desc: 'Soft landing ting — ball joins chain, no match.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'match',
    desc: 'Crystal chord burst. Pitched up +2 semitones per combo level.',
    buttons: [1,2,3,4,5,6,7].map(n => ({ label: 'x' + n, args: [n] })),
  },
  {
    name: 'chain',
    desc: 'Chain reaction — higher voicing, same pitch ladder as match.',
    buttons: [1,2,3,4,5,6,7].map(n => ({ label: 'x' + n, args: [n] })),
  },
  {
    name: 'swap',
    desc: 'Two-note sparkle trill on ball swap.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'powerup',
    desc: 'Magical shimmer — powerup activated.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'levelup',
    desc: 'Ascending C major arpeggio — level cleared.',
    buttons: [{ label: 'Play', args: [] }],
  },
  {
    name: 'gameover',
    desc: 'Descending A minor — game over.',
    buttons: [{ label: 'Play', args: [] }],
  },
];

function flash(btn) {
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 300);
}

const grid = document.getElementById('grid');

for (const def of SOUND_DEFS) {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = def.name;

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = def.desc;

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  for (const b of def.buttons) {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (def.buttons.length > 1) btn.className = 'combo-btn';
    btn.onclick = () => { playSound(def.name, ...b.args); flash(btn); };
    btnRow.appendChild(btn);
  }

  card.append(title, desc, btnRow);
  grid.appendChild(card);
}

// ── Chain Reaction Sequence ──

function buildDots() {
  const steps = +document.getElementById('seq-steps').value;
  const container = document.getElementById('seq-dots');
  container.innerHTML = '';
  // Each step = match then chain (except last step has no trailing chain)
  for (let i = 1; i <= steps; i++) {
    const m = document.createElement('div');
    m.className = 'seq-dot';
    m.id = 'dot-match-' + i;
    m.textContent = 'M×' + i;
    container.appendChild(m);
    if (i < steps) {
      const c = document.createElement('div');
      c.className = 'seq-dot';
      c.id = 'dot-chain-' + i;
      c.textContent = 'C×' + i;
      container.appendChild(c);
    }
  }
}

let seqRunning = false;

function playSequence() {
  if (seqRunning) return;
  seqRunning = true;
  const btn = document.getElementById('seq-play-btn');
  btn.disabled = true;

  const steps = +document.getElementById('seq-steps').value;
  const gap   = +document.getElementById('seq-gap').value;

  // Build the event timeline:
  // match(1) at 0, chain(1) at gap, match(2) at gap*2, chain(2) at gap*3, …
  const events = [];
  for (let i = 1; i <= steps; i++) {
    events.push({ type: 'match', combo: i, t: (i - 1) * 2 * gap });
    if (i < steps) {
      events.push({ type: 'chain', combo: i, t: (i - 1) * 2 * gap + gap });
    }
  }

  // Reset dots
  document.querySelectorAll('.seq-dot').forEach(d => d.classList.remove('active-match', 'active-chain'));

  events.forEach(ev => {
    setTimeout(() => {
      playSound(ev.type, ev.combo);
      const dot = document.getElementById('dot-' + ev.type + '-' + ev.combo);
      if (dot) {
        dot.classList.add(ev.type === 'match' ? 'active-match' : 'active-chain');
        setTimeout(() => dot.classList.remove('active-match', 'active-chain'), gap * 0.8);
      }
    }, ev.t);
  });

  const totalDuration = events[events.length - 1].t + 800;
  setTimeout(() => {
    seqRunning = false;
    btn.disabled = false;
  }, totalDuration);
}

buildDots();
</script>
</body>
</html>
