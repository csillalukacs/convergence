<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convergence</title>
<link rel="stylesheet" href="convergence.css">
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="hud-panel">Score: <span class="value" id="score-val">0</span></div>
  <div class="hud-panel">Level: <span class="value" id="level-val">1</span></div>
  <div class="hud-panel">Chain: <span class="value" id="chain-bonus-val">x1</span></div>
  <div id="progress-panel">
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="progress-label">RESONANCE</div>
  </div>
</div>

<div id="swap-hint">Right-click or Space to swap</div>

<div id="audio-control">
  <button id="mute-btn" onclick="toggleMute()">SOUND</button>
  <input type="range" id="volume-slider" min="0" max="100" value="75" oninput="setVolume(this.value)">
</div>

<div id="title-screen">
  <div class="gear-deco"></div>
  <div class="gear-deco"></div>
  <div class="gear-deco"></div>
  <h1>CONVERGENCE</h1>
  <div class="subtitle">Align the Crystal Chain</div>
  <div id="title-level-wrap">
    <div class="level-picker" id="title-level-picker"></div>
  </div>
  <div class="title-btn-row">
    <button class="btn-start" onclick="startGame(_pickerSelected)">BEGIN</button>
    <button class="btn-select-level" onclick="toggleTitlePicker()">SELECT LEVEL</button>
  </div>
</div>

<div id="game-over">
  <h2 id="go-title">CONVERGENCE LOST</h2>
  <div class="final-score" id="final-score">Score: 0</div>
  <div class="final-score" id="final-level">Level: 1</div>
  <button class="btn-start" onclick="startGame()">TRY AGAIN</button>
</div>

<div id="pause-screen">
  <h2>PAUSED</h2>
  <div class="pause-hint">Press P or ESC to resume</div>
  <div class="level-picker-label">JUMP TO LEVEL</div>
  <div class="level-picker" id="pause-level-picker"></div>
</div>

<div id="level-banner"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="audio.js"></script>
<script src="path.js"></script>
<script src="levels.js"></script>
<script src="scene.js"></script>
<script src="chain.js"></script>
<script src="main.js"></script>
<script>
// ─── LEVEL PICKER ───
let _pickerSelected = 1;

function buildLevelPickers() {
  ['title-level-picker', 'pause-level-picker'].forEach(id => {
    const isPause = id === 'pause-level-picker';
    const el = document.getElementById(id);
    el.innerHTML = '';
    for (let i = 1; i <= LEVELS.length; i++) {
      const btn = document.createElement('button');
      btn.className = 'lvl-btn' + (!isPause && i === 1 ? ' lvl-btn-active' : '');
      btn.textContent = i;
      btn.dataset.n = i;
      btn.onclick = () => {
        if (isPause) {
          jumpToLevel(i);
        } else {
          _pickerSelected = i;
          el.querySelectorAll('.lvl-btn').forEach(b => b.classList.toggle('lvl-btn-active', +b.dataset.n === i));
        }
      };
      el.appendChild(btn);
    }
  });
}

function toggleTitlePicker() {
  const wrap = document.getElementById('title-level-wrap');
  wrap.classList.toggle('open');
}

window.addEventListener('DOMContentLoaded', buildLevelPickers);
</script>
</body>
</html>
